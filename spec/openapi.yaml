      operationId: "api_list_care_records"
      tags: ["api-ward"]
      summary: "実施記録の一覧（投薬・給餌・計測）"
      parameters:
        - $ref: "#/components/parameters/HospitalizationId"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: ["items", "total"]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CareRecord" }
                  total: { type: integer, minimum: 0 }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: "api_create_care_record"
      tags: ["api-ward"]
      summary: "実施記録を1件追加"
      description: |
        **`staff_id`（実施者）は必須。** 空の記録行は作らない
        （`model.md` 15章「実施者が空の記録行を作らないこと」）。
        欠けている場合は 422 `invalid_input`。
      parameters:
        - $ref: "#/components/parameters/HospitalizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareRecordCreate" }
      responses:
        "201":
          description: "作成できた"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reservations:
    get:
      operationId: "api_list_reservations"
      tags: ["api-reservation"]
      summary: "予約の一覧（期間・担当・処置室で絞り込み）"
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: staff_id
          in: query
          required: false
          schema: { type: integer }
        - name: room
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: ["booked", "cancelled"] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationList" }
    post:
      operationId: "api_create_reservation"
      tags: ["api-reservation"]
      summary: "予約を作成する"
      description: |
        同じ担当（`staff_id`）または同じ処置室（`room`）で、時間帯
        （`starts_at`〜`ends_at`）が重なる `status=booked` の予約が既にあれば
        **409 `reservation_conflict`** を返す。取消済み（`status=cancelled`）の
        予約とは重ねてよい。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationCreate" }
      responses:
        "201":
          description: "作成できた"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReservationConflict" }

  /api/reservations/{id}:
    get:
      operationId: "api_get_reservation"
      tags: ["api-reservation"]
      summary: "予約1件の詳細"
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: "api_update_reservation"
      tags: ["api-reservation"]
      summary: "予約の変更（時間・担当・処置室の変更を含む）"
      description: "変更後の時間帯が重なる場合も 409 `reservation_conflict`。"
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationCreate" }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReservationConflict" }

  /api/reservations/{id}/cancel:
    post:
      operationId: "api_cancel_reservation"
      tags: ["api-reservation"]
      summary: "予約の取消"
      description: "`status` を `cancelled` にする。物理削除はしない。"
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================
  # データのルート — スタッフ・マスタ・その他
  # ============================================================

  /api/staff:
    get:
      operationId: "api_list_staff"
      tags: ["api-staff"]
      summary: "スタッフ一覧"
      parameters:
        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: ["items", "total"]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Staff" }
                  total: { type: integer, minimum: 0 }

  /api/features:
    get:
      operationId: "api_list_features"
      tags: ["api-misc"]
      summary: "作らないと決めた機能・畳んだ機能の一覧（参照専用）"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: ["items"]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeatureNote" }

  /api/todo/{key}:
    get:
      operationId: "api_get_todo"
      tags: ["api-misc"]
      summary: "作らないと決めたボタンの理由（1件）"
      parameters:
        - $ref: "#/components/parameters/TodoKey"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureNote" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/masters/{key}:
    get:
      operationId: "api_get_master"
      tags: ["api-masters"]
      summary: "固定データ（マスタ）の一覧（参照専用）"
      description: |
        `data/masters.json` / `data/price_items.json` / `data/lab_items.json` の
        内容を返す。**このAPIに書き込み（POST/PATCH/DELETE）は無い**
        （`spec/README.md` 「マスタ管理の画面：一覧と参照は作る。編集は作らない」）。
      parameters:
        - $ref: "#/components/parameters/MasterKey"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: ["key", "items", "total"]
                properties:
                  key: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      description: "カテゴリごとに項目の形が異なる。共通するのは `code` と `label`。"
                      required: ["code", "label"]
                      properties:
                        code: { type: string }
                        label: { type: string }
                      additionalProperties: true
                  total: { type: integer, minimum: 0 }
        "404": { $ref: "#/components/responses/NotFound" }

components:

  # ============================================================
  # 共通レスポンス
  # ============================================================

  responses:

    HtmlOk:
      description: "OK"
      content:
        text/html:
          schema: { type: string }

    BadRequest:
      description: "リクエストの本文がJSONとして壊れている。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: "invalid_json"
              message: "リクエストの本文がJSONとして壊れています。書き方を確認してください。"

    ValidationError:
      description: "JSONとしては読めるが、項目が足りない・型が違う。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: "invalid_input"
              message: "入力の形式が正しくありません。必須の項目や値の型を確認してください。"
              details:
                - field: "staff_id"
                  message: "実施者（staff_id）は必須です。"

    NotFound:
      description: "指定されたデータが見つからない。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: "not_found"
              message: "指定されたデータが見つかりません。"

    Forbidden:
      description: "この操作を行う権限がない。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: "forbidden"
              message: "この操作を行う権限がありません。"

    ReservationConflict:
      description: "指定した時間帯が、同じ担当または同じ処置室の別の予約と重なっている。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: "reservation_conflict"
              message: "指定した時間帯は、担当または処置室の予定と重なっています。"

    ServerError:
      description: "保存に失敗した。"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: "save_failed"
              message: "保存に失敗しました。時間をおいてもう一度お試しください。"

  # ============================================================
  # 共通パラメータ
  # ============================================================

  parameters:

    KarteNo:
      name: karte_no
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]+-[0-9]+$" }
      description: "カルテNo（例: 1001-1）。カルテを持つ画面・APIのURLには常にこの形式で1つだけ現れる。"

    OwnerNo:
      name: owner_no
      in: path
      required: true
      schema: { type: string }
      description: "飼主の表示用番号。"

    VisitId:
      name: visit_id
      in: path
      required: true
      schema: { type: integer }

    ReceptionId:
      name: id
      in: path
      required: true
      schema: { type: integer }

    PaperId:
      name: paper_id
      in: path
      required: true
      schema: { type: integer }

    BillingId:
      name: id
      in: path
      required: true
      schema: { type: integer }

    LabTestId:
      name: id
      in: path
      required: true
      schema: { type: integer }

    ReservationId:
      name: id
      in: path
      required: true
      schema: { type: integer }

    HospitalizationId:
      name: id
      in: path
      required: true
      schema: { type: integer }

    DosingKindId:
      name: kind_id
      in: path
      required: true
      schema: { type: integer }
      description: "投薬種別マスタの行id（`data/masters.json`）。"

    PreventionKindId:
      name: kind_id
      in: path
      required: true
      schema: { type: integer }
      description: "予防種別マスタの行id（`data/masters.json`）。"

    MasterKey:
      name: key
      in: path
      required: true
      schema: { type: string }
      description: "マスタのカテゴリ（例: price_item / lab_item / reception_kind / prevention_kind / department / phrase）。語彙は固定データを正とする。"

    TodoKey:
      name: key
      in: path
      required: true
      schema: { type: string }
      description: "作らないと決めたボタンの識別子。語彙は `spec/screens.md` / `spec/acceptance.md` を正とする。"

    FoldedKey:
      name: key
      in: path
      required: true
      schema: { type: string }
      description: "この企画で意図して作らなかった機能の識別子（`model.md` 「落としたもの」に対応）。"

    QueryQ:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: "横断検索の語。"

    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: "true のとき、論理削除済み（`deleted_at` が入っている）行も含める。既定は含めない。"

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }

  # ============================================================
  # スキーマ
  # ============================================================

  schemas:

    Error:
      type: object
      required: ["error"]
      properties:
        error:
          type: object
          required: ["code", "message"]
          properties:
            code:
              type: string
              enum:
                - "invalid_json"
                - "invalid_input"
                - "not_found"
                - "forbidden"
                - "save_failed"
                - "reservation_conflict"
            message:
              type: string
            details:
              type: array
              minItems: 1
              items:
                type: object
                required: ["field", "message"]
                properties:
                  field: { type: string }
                  message: { type: string }

    # ---- 1. Clinic ----
    Clinic:
      type: object
      required: ["id", "name", "reservation_slot_minutes", "tax_rate", "closed_weekdays"]
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string }
        postal_code: { type: string }
        address1: { type: string }
        address2: { type: ["string", "null"] }
        phone: { type: string }
        fax: { type: ["string", "null"] }
        director_name: { type: string }
        reservation_slot_minutes: { type: integer, minimum: 1, default: 15 }
        tax_rate: { type: number, minimum: 0, maximum: 1, default: 0.10 }
        closed_weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: "0=月 … 6=日"

    ClinicForm:
      type: object
      description: "`/settings` の保存フォーム（`application/x-www-form-urlencoded`）。フィールドは `Clinic` と同じ。"

    # ---- 2. Staff ----
    Staff:
      type: object
      required: ["id", "staff_code", "name", "role", "is_active"]
      properties:
        id: { type: integer, readOnly: true }
        staff_code: { type: string }
        name: { type: string }
        role: { type: string, enum: ["vet", "nurse", "office"] }
        is_active: { type: boolean }

    # ---- 3. Owner ----
    Owner:
      type: object
      required: ["id", "owner_no", "name_kana", "name_kanji"]
      properties:
        id: { type: integer, readOnly: true }
        owner_no: { type: string }
        name_kana: { type: string }
        name_kanji: { type: string }
        postal_code: { type: string }
        address1: { type: string }
        address2: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        mobile: { type: ["string", "null"] }
        deleted_at: { type: ["string", "null"], format: date-time, readOnly: true }

    # ---- 4. Patient ----
    Patient:
      type: object
      required: ["id", "karte_no", "owner_id", "name_kana", "name_kanji", "species", "sex"]
      properties:
        id: { type: integer, readOnly: true }
        karte_no: { type: string, pattern: "^[0-9]+-[0-9]+$", readOnly: true }
        owner_id: { type: integer }
        name_kana: { type: string }
        name_kanji: { type: string }
        species: { type: string }
        breed: { type: ["string", "null"] }
        sex: { type: string, enum: ["male", "female", "unknown"] }
        birth_date: { type: ["string", "null"], format: date }
        neuter_date: { type: ["string", "null"], format: date }
        deleted_at: { type: ["string", "null"], format: date-time, readOnly: true }

    PatientWithOwner:
      allOf:
        - { $ref: "#/components/schemas/Patient" }
        - type: object
          properties:
            owner: { $ref: "#/components/schemas/Owner" }

    PatientWithOwnerForm:
      type: object
      description: "`/animals/new` の保存フォーム（`application/x-www-form-urlencoded`）。飼主・動物の各項目をまとめて送る。"

    PatientList:
      type: object
      required: ["items", "total"]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PatientWithOwner" }
        total: { type: integer, minimum: 0 }

    # ---- 5. Reception ----
    Reception:
      type: object
      required: ["id", "patient_id", "display_no", "received_at", "status"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        display_no: { type: integer }
        received_at: { type: string, format: date-time }
        owner_purpose: { type: ["string", "null"] }
        medical_purpose: { type: ["string", "null"] }
        status: { type: string, enum: ["waiting", "in_exam", "done"] }
        staff_id: { type: ["integer", "null"] }

    ReceptionList:
      type: object
      required: ["items", "total"]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Reception" }
        total: { type: integer, minimum: 0 }

    # ---- 6. Visit / 7. ProgressNote ----
    ProgressNote:
      type: object
      required: ["row_no", "entry_date"]
      properties:
        id: { type: integer, readOnly: true }
        visit_id: { type: integer, readOnly: true }
        row_no: { type: integer, minimum: 1 }
        entry_date: { type: string, format: date }
        temperature_c: { type: ["number", "null"] }
        pulse: { type: ["integer", "null"] }
        respiration: { type: ["integer", "null"] }
        body_weight_kg: { type: ["number", "null"] }
        symptom_course: { type: ["string", "null"] }
        treatment_rx: { type: ["string", "null"] }
        note: { type: ["string", "null"] }

    Visit:
      type: object
      required: ["id", "patient_id", "visit_no", "visit_date"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        visit_no: { type: integer, readOnly: true }
        visit_date: { type: string, format: date }
        visit_time: { type: ["string", "null"], format: time }
        body_weight_kg: { type: ["number", "null"] }
        chief_complaint: { type: ["string", "null"] }
        symptom: { type: ["string", "null"] }
        diagnosis: { type: ["string", "null"] }
        treatment: { type: ["string", "null"] }
        staff_id: { type: ["integer", "null"] }
        deleted_at: { type: ["string", "null"], format: date-time, readOnly: true }
        progress_notes:
          type: array
          items: { $ref: "#/components/schemas/ProgressNote" }

    VisitCreate:
      allOf:
        - { $ref: "#/components/schemas/Visit" }
      description: "作成・更新時に送る形。`id` / `visit_no` / `deleted_at` は無視される（サーバが決める）。"

    VisitForm:
      type: object
      description: "`/animals/{karte_no}/karte` の保存フォーム（`application/x-www-form-urlencoded`）。診察本体と経過記録の行をまとめて送る。"

    VisitList:
      type: object
      required: ["items", "total"]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Visit" }
        total: { type: integer, minimum: 0 }

    # ---- 8. Prevention ----
    Prevention:
      type: object
      required: ["id", "patient_id", "kind", "performed_date"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        kind: { type: string }
        content: { type: ["string", "null"] }
        performed_date: { type: string, format: date }
        next_due_date: { type: ["string", "null"], format: date }

    PreventionForm:
      type: object
      description: "`/animals/{karte_no}/prevention/{kind_id}` の保存フォーム（`application/x-www-form-urlencoded`）。"

    PreventionList:
      type: object
      required: ["items", "total"]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Prevention" }
        total: { type: integer, minimum: 0 }

    # ---- 9. Dosing ----
    Dosing:
      type: object
      required: ["patient_id", "kind", "fiscal_year"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        kind: { type: string }
        fiscal_year: { type: integer }
        m01: { type: ["string", "null"] }
        m02: { type: ["string", "null"] }
        m03: { type: ["string", "null"] }
        m04: { type: ["string", "null"] }
        m05: { type: ["string", "null"] }
        m06: { type: ["string", "null"] }
        m07: { type: ["string", "null"] }
        m08: { type: ["string", "null"] }
        m09: { type: ["string", "null"] }
        m10: { type: ["string", "null"] }
        m11: { type: ["string", "null"] }
        m12: { type: ["string", "null"] }

    DosingForm:
      type: object
      description: "`/animals/{karte_no}/dosing/{kind_id}` の保存フォーム（`application/x-www-form-urlencoded`）。m01〜m12を送る。"

    # ---- 10. LabTest / 11. LabTestItem ----
    LabTestItem:
      type: object
      required: ["item_code"]
      properties:
        id: { type: integer, readOnly: true }
        lab_test_id: { type: integer, readOnly: true }
        item_code: { type: string }
        value_num: { type: ["number", "null"] }
        value_text: { type: ["string", "null"] }
        reference_low:
          type: ["number", "null"]
          readOnly: true
          description: "`data/lab_items.json` から患者の種別・性別で引いた下限。保存はしない。"
        reference_high:
          type: ["number", "null"]
          readOnly: true
          description: "同上、上限。"
        judgment:
          type: string
          readOnly: true
          enum: ["", "H", "L"]
          description: |
            **空 / `H` / `L` の3つだけ。**
            基準の上を超えていれば `H`、下回っていれば `L`、範囲内・判定できない場合は空。
            `spec/acceptance.md` の検算5と `tests/` が読む値がこれ。
            画面では `data-check="lab_test_item.judgment"` に同じ値を出す。
        out_of_range:
          type: boolean
          readOnly: true
          description: "判定欄の色分けに使うフラグ。色そのものは各スタックの流儀でよい。"

    LabTest:
      type: object
      required: ["id", "patient_id", "visit_id", "category", "tested_on"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        visit_id: { type: integer }
        category: { type: string }
        tested_on: { type: string, format: date }
        tested_at_time: { type: ["string", "null"], format: time }
        staff_id: { type: ["integer", "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/LabTestItem" }

    LabTestCreate:
      type: object
      required: ["visit_id", "category", "tested_on", "items"]
      properties:
        visit_id: { type: integer }
        category: { type: string }
        tested_on: { type: string, format: date }
        tested_at_time: { type: ["string", "null"], format: time }
        staff_id: { type: ["integer", "null"] }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: ["item_code"]
            properties:
              item_code: { type: string }
              value_num: { type: ["number", "null"] }
              value_text: { type: ["string", "null"] }

    LabTestForm:
      type: object
      description: "`/animals/{karte_no}/exam` の保存フォーム（`application/x-www-form-urlencoded`）。"

    LabTestList:
      type: object
      required: ["items", "total"]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LabTest" }
        total: { type: integer, minimum: 0 }

    # ---- 12. Billing / 13. BillingDetail ----
    BillingDetail:
      type: object
      required: ["row_no", "price_code", "name", "quantity", "is_taxable"]
      properties:
        id: { type: integer, readOnly: true }
        billing_id: { type: integer, readOnly: true }
        row_no: { type: integer, minimum: 1 }
        price_code: { type: string }
        name: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_price:
          type: ["integer", "null"]
          description: "未設定（null）がありうる。**0円として合計に入れてはならない。**"
        is_taxable: { type: boolean }
        amount:
          type: ["integer", "null"]
          readOnly: true
          description: "quantity * unit_price。unit_price が null のときは null（合計に含めない）。"

    Billing:
      type: object
      required: ["id", "patient_id", "owner_id", "slip_no", "status", "billed_on", "details",
                 "net_amount", "tax_amount", "total_amount", "excluded_count"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        owner_id: { type: integer, readOnly: true }
        slip_no: { type: string, readOnly: true }
        status: { type: string, enum: ["draft", "confirmed"] }
        billed_on: { type: string, format: date }
        staff_id: { type: ["integer", "null"] }
        cashier_staff_id: { type: ["integer", "null"] }
        paid_amount: { type: ["integer", "null"] }
        payment_method: { type: ["string", "null"] }
        details:
          type: array
          items: { $ref: "#/components/schemas/BillingDetail" }
        net_amount:
          type: integer
          readOnly: true
          description: |
            **税抜合計。** unit_price が設定されている行だけを足したもの。
            未設定の行は0円として足さない（`spec/README.md`）。
            画面では `data-check="billing.net_amount"` に出す。
        taxable_subtotal:
          type: integer
          readOnly: true
          description: "そのうち課税対象の小計（税抜）。消費税はこれに税率を掛けて伝票単位で1回だけ切り捨てる。"
        nontaxable_subtotal:
          type: integer
          readOnly: true
          description: "unit_price が設定されている非課税行の小計。"
        tax_amount:
          type: integer
          readOnly: true
          description: "taxable_subtotal に Clinic.tax_rate を掛けた額。丸めの規則は `spec/acceptance.md` に従う（無指定なら丸めない）。"
        total_amount:
          type: integer
          readOnly: true
          description: "taxable_subtotal + tax_amount + nontaxable_subtotal。unit_price 未設定の行は含まない。"
        excluded_count:
          type: integer
          readOnly: true
          minimum: 0
          description: "unit_price が未設定で、total に含まれなかった明細行の数。0件でも必ず返す。"

    BillingCreate:
      type: object
      required: ["billed_on", "details"]
      properties:
        billed_on: { type: string, format: date }
        status: { type: string, enum: ["draft", "confirmed"], default: "draft" }
        staff_id: { type: ["integer", "null"] }
        cashier_staff_id: { type: ["integer", "null"] }
        paid_amount: { type: ["integer", "null"] }
        payment_method: { type: ["string", "null"] }
        details:
          type: array
          items:
            type: object
            required: ["price_code", "name", "quantity", "is_taxable"]
            properties:
              price_code: { type: string }
              name: { type: string }
              quantity: { type: number, exclusiveMinimum: 0 }
              unit_price: { type: ["integer", "null"] }
              is_taxable: { type: boolean }

    BillingForm:
      type: object
      description: "`/animals/{karte_no}/accounting` の保存フォーム（`application/x-www-form-urlencoded`）。"

    BillingList:
      type: object
      required: ["items", "total"]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Billing" }
        total: { type: integer, minimum: 0 }

    DmRow:
      type: object
      required: ["karte_no", "owner_name_kanji", "patient_name_kanji"]
      properties:
        karte_no: { type: string }
        owner_name_kanji: { type: string }
        patient_name_kanji: { type: string }
        kind: { type: ["string", "null"] }
        next_due_date: { type: ["string", "null"], format: date }
        performed_date: { type: ["string", "null"], format: date }

    SalesSummary:
      type: object
      description: |
        売上を**3つの軸で同時に**返す。片方ずつ返す形（group_by）にしない。

        検算1は「分類別・担当別・日別の合計が、総合計と一致すること」を確かめるもので、
        **3つを同時に見られないと成立しない**（別々に取ると、取った時点がずれる余地も残る）。

        消費税は含めない。**3方向一致の対象は税抜売上のみ**。
        内訳へ税を按分すると、按分の方法しだいで答えが変わり検算にならない
        （`spec/acceptance.md` 検算1）。
      required: ["by_category", "by_staff", "by_date", "total_net_amount"]
      properties:
        from:
          type: ["string", "null"]
          format: date
          description: "省略可。省略したら全期間。"
        to:
          type: ["string", "null"]
          format: date
          description: "省略可。省略したら全期間。"
        by_category:
          type: array
          description: "分類別（料金の上位1階層）。"
          items: { $ref: "#/components/schemas/SalesRow" }
        by_staff:
          type: array
          description: "担当別。`Billing.staff_id`（診療担当）で分ける。`cashier_staff_id` は使わない。"
          items: { $ref: "#/components/schemas/SalesRow" }
        by_date:
          type: array
          description: "日別。`Billing.billed_on`（JSTの暦日）で分ける。"
          items: { $ref: "#/components/schemas/SalesRow" }
        total_net_amount:
          type: integer
          description: "対象期間の税抜売上の総合計。3つの内訳の合計はこれと一致すること。"
        total_tax_amount:
          type: integer
          description: "対象期間の全伝票の消費税額の合計。内訳へは按分しない。"
        excluded_count_total:
          type: integer
          description: "単価未設定で合計に入れなかった明細の行数。"

    SalesRow:
      type: object
      required: ["key", "net_amount"]
      properties:
        key:
          type: ["string", "integer"]
          description: "分類名・スタッフID・日付のいずれか。軸によって変わる。"
        label:
          type: string
          description: "画面に出す名前。"
        net_amount:
          type: integer
          description: "税抜。画面では `data-check=\"sales_summary.net_amount\"` に出す。"
        share_pct:
          type: number
          description: |
            構成比。**`by_category` の行にだけ付ける。**
            最大剰余法で丸め、**和がちょうど 100.0** になること。
            画面では `data-check="sales_summary.share_pct"`。

    Reservation:
      type: object
      required: ["id", "patient_id", "starts_at", "ends_at", "staff_id", "room", "status"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        staff_id: { type: integer }
        room: { type: string }
        purpose: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        status: { type: string, enum: ["booked", "cancelled"], readOnly: true }

    ReservationCreate:
      type: object
      required: ["patient_id", "starts_at", "ends_at", "staff_id", "room"]
      properties:
        patient_id: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        staff_id: { type: integer }
        room: { type: string }
        purpose: { type: ["string", "null"] }
        note: { type: ["string", "null"] }

    ReservationForm:
      type: object
      description: "`/reservations` の登録・変更フォーム（`application/x-www-form-urlencoded`）。"

    ReservationList:
      type: object
      required: ["items", "total"]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Reservation" }
        total: { type: integer, minimum: 0 }

    # ---- 15. Hospitalization ----
    CareRecord:
      type: object
      required: ["id", "hospitalization_id", "recorded_at", "category", "performed_by_staff_id"]
      properties:
        id: { type: integer, readOnly: true }
        hospitalization_id: { type: integer, readOnly: true }
        recorded_at: { type: string, format: date-time }
        category: { type: string, enum: ["medication", "feeding", "measurement"] }
        content: { type: ["string", "null"] }
        performed_by_staff_id:
          type: integer
          description: "実施者。**必須。** 空の記録行は作らない。"

    CareRecordCreate:
      type: object
      required: ["recorded_at", "category", "performed_by_staff_id"]
      properties:
        recorded_at: { type: string, format: date-time }
        category: { type: string, enum: ["medication", "feeding", "measurement"] }
        content: { type: ["string", "null"] }
        performed_by_staff_id: { type: integer }

    Hospitalization:
      type: object
      required: ["id", "patient_id", "admitted_on", "room"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        admitted_on: { type: string, format: date }
        discharged_on: { type: ["string", "null"], format: date }
        room: { type: string }
        care_records:
          type: array
          items: { $ref: "#/components/schemas/CareRecord" }

    HospitalizationCreate:
      type: object
      required: ["admitted_on", "room"]
      properties:
        admitted_on: { type: string, format: date }
        discharged_on: { type: ["string", "null"], format: date }
        room: { type: string }

    HospitalizationForm:
      type: object
      description: "`/animals/{karte_no}/ward` の入院登録フォーム（`application/x-www-form-urlencoded`）。"

    # ---- 書類（papers） ----
    Paper:
      type: object
      required: ["id", "patient_id", "title"]
      properties:
        id: { type: integer, readOnly: true }
        patient_id: { type: integer }
        title: { type: string }
        note: { type: ["string", "null"] }
        created_at: { type: string, format: date-time, readOnly: true }

    PaperList:
      type: object
      required: ["items", "total"]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Paper" }
        total: { type: integer, minimum: 0 }

    # ---- 折りたたみ・ToDo・機能設定 ----
    FeatureNote:
      type: object
      required: ["key", "kind", "title", "message"]
      properties:
        key: { type: string }
        kind:
          type: string
          enum: ["todo", "folded"]
          description: "todo = 押しても保存されない灰色のボタン。folded = この企画で意図して作らなかった機能。"
        title: { type: string }
        message: { type: string }
