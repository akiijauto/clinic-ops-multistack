openapi: 3.1.0

info:
  title: "clinic-ops-multistack API"
  version: "0.1.0"
  description: |
    動物病院の窓口業務システム。**この文書が唯一の正**（`spec/README.md`）。
    5つの実装（Go / Rails / Laravel / FastAPI / Next.js）は、この契約に対して外から
    同じ振る舞いをすること。中身（保存先・フレームワークの流儀）は自由。

    ## 画面のルートとデータのルート

    このシステムは基本的にサーバがHTMLを返す作り（Next.jsだけは事情が違うが、
    URLと振る舞いは揃える）。契約は2種類に分かれる。

    - **画面のルート**（`text/html` を返す）: 契約するのは **200が返ること** と
      **`x-data-testids` に列挙した目印が存在すること** の2点だけ。HTMLの見た目・
      マークアップの細部はスタックの流儀に任せる。
    - **データのルート**（`application/json` を返す／受け取る。`/dm.csv` のみ
      `text/csv`）: 値そのものを契約する。数値・件数・並び順の正しさは、
      **必ずこちら側で検証できるようにする。**

    ## HTMLフォーム送信時のエラーの出し方（重要）

    画面（HTML）ルートは、入力エラーや保存失敗が起きても **200 OK でフォームを
    再描画し**、打った値と一緒にエラー文言を `data-testid="error-banner"` に出す。
    ステータスコードで判定するのは常にデータのルート側であり、画面のルート側は
    「200 かつ error-banner の文言」で判定する。これは既存の実システムが
    実際に踏んだ事故（保存を断ったのに確定済みの値で描き直され、打った値が消えた）
    を避けるための形で、押し直しをさせないためにこの形にしてある。

    **文言そのものは画面・データの両ルートで一字一句共通。**
    下記「エラーの文言」の節にあるものを、状況に応じてそのまま使うこと。
    独自の文言を作らないこと（`coordination/DECISIONS.md` 第4節）。

    ## 日付・時刻

    **すべて JST（日本標準時、UTC+09:00）で扱う。** 集計の月境界・日境界もJST。
    `date-time` 型の値は `+09:00` オフセット付きのISO 8601で表す
    （例: `2026-09-05T10:30:00+09:00`）。サーバの内部時刻がUTCであっても、
    HTTPでやり取りする値はJSTに変換してから出し、受けるときもJSTとして解釈する。

    ## 文字数の数え方

    文字数の上限がある項目は、**Unicodeの文字数で数える。バイト数では数えない**
    （日本語はUTF-8で3倍になるため）。個別の上限値は `spec/acceptance.md` に従う。

    ## data-testid の命名規則

    共通テストがHTMLの中身を確認できるように、**目印は必ず `data-testid` 属性に置く**。

    | 種類 | 形 | 例 |
    | --- | --- | --- |
    | 画面全体のコンテナ | `screen-<画面キー>` | `screen-today` |
    | 一覧の行（繰り返し） | `row-<資源名>` | `row-reception` |
    | 一覧が0件のときの表示 | `empty-<資源名>` | `empty-reservation` |
    | 保存・実行に成功したときの通知 | `success-banner` | 同左 |
    | 保存・実行に失敗したときの通知（エラー文言を内包） | `error-banner` | 同左 |
    | 押しても保存されない・常に灰色のボタン（3つだけ） | `disabled-action-<todoキー>` | `disabled-action-temp_save` |
    | 個別の数値（検算対象） | `<画面キー>-<項目名>` | `billing-total` / `billing-excluded-count` |
    | 検査項目1行ぶんの値・判定 | `lab-item-<item_code>-value` / `lab-item-<item_code>-judgment` | `lab-item-wbc-judgment` |

    各画面のルート定義に `x-data-testids` として、その画面が最低限持つべき目印の
    一覧を書いた。**これが無いテストは書けないので、実装側が書き足す分には構わないが、
    ここに列挙したものは必ず存在すること。**

    ## エラーの文言（一字一句、これを使う）

    | 状況 | HTTPステータス（データのルート） | `error.code` | 文言 |
    | --- | --- | --- | --- |
    | 入力がJSONとして壊れている（構文エラー） | 400 | `invalid_json` | 「リクエストの本文がJSONとして壊れています。書き方を確認してください。」 |
    | 入力の形が違う（項目が足りない・型が違う） | 422 | `invalid_input` | 「入力の形式が正しくありません。必須の項目や値の型を確認してください。」 |
    | 見つからない | 404 | `not_found` | 「指定されたデータが見つかりません。」 |
    | 権限がない | 403 | `forbidden` | 「この操作を行う権限がありません。」 |
    | 保存に失敗した | 500 | `save_failed` | 「保存に失敗しました。時間をおいてもう一度お試しください。」 |
    | 予約が重なっている（業務ルール違反。上記5つに次いで固定する） | 409 | `reservation_conflict` | 「指定した時間帯は、担当または処置室の予定と重なっています。」 |

    **「壊れている」（400・`invalid_json`）と「形が違う」（422・`invalid_input`）を
    混同しないこと。** 送り手が直すべき場所が違う——前者は本文そのものがJSONとして
    読めない（構文）、後者はJSONとしては読めるが項目や型が契約と合わない（意味）。
    ステータスコードと文言の両方で区別できるようにしてある
    （2026-09-05、別プロジェクトで同じ設計をして効果を確認済み）。

    「権限がない」は、この計画では**ログインを作らない**
    （`coordination/DECISIONS.md` 第4節「認証はこの計画では扱わない」）ため、
    未ログインを理由に発生することは無い。発生しうるのは、担当の役割
    （`Staff.role`）に基づく制限など、`screens.md` / `acceptance.md` が
    個別に定める業務ルールに限る。ここで決めるのは**そのときの文言と
    ステータスコードだけ**であり、いつ発生させるかはここでは決めない。

    `422 invalid_input` は、`error.details` にフィールド単位の指摘を含めてよい
    （必須。空配列は不可、最低1件）。

    ## この契約に無いもの（`model.md` を見る）

    レセプト（保険請求）・監査ログ・マスタの編集（一覧と参照のみ）・
    紙カルテPDF取込・分院・書きかけカルテの自動保存（`/karte/draft` 系）は、
    この企画では意図して作らない。ルートを用意しない。

  x-testid-convention: |
    上の「data-testid の命名規則」節を参照。

servers:
  - url: "http://localhost:8000"
    description: "各実装が自分のポートで待ち受ける。実際のポート番号は各スタックのREADMEに従う。"

tags:
  - name: "screens-top"
    description: "トップ／このシステムについて"
  - name: "screens-reception"
    description: "受付・患者（本日の患者・新規・顧客・検索・来院履歴・削除・折りたたみ表示）"
  - name: "screens-clinical"
    description: "診療（カルテ・検査・投薬・予防・書類）"
  - name: "screens-billing"
    description: "会計・売上（会計・会計履歴・DM・売上集計）"
  - name: "screens-ops"
    description: "入院・予約・業務（入院・予約・ToDo・スタッフ）"
  - name: "screens-settings"
    description: "設定（設定・機能設定・取込・マスタ）"
  - name: "api-reception"
    description: "受付・患者のデータ"
  - name: "api-clinical"
    description: "診療のデータ"
  - name: "api-billing"
    description: "会計・売上のデータ"
  - name: "api-reservation"
    description: "予約のデータ"
  - name: "api-ward"
    description: "入院のデータ"
  - name: "api-staff"
    description: "スタッフのデータ"
  - name: "api-masters"
    description: "固定データ（マスタ）"
  - name: "api-misc"
    description: "その他のユーティリティ"

paths:

  # ============================================================
  # 画面のルート — 1 トップ／このシステムについて
  # ============================================================

  /:
    get:
      operationId: "screen_top"
      tags: ["screens-top"]
      summary: "トップ"
      description: "入口。何も選ばずに開いたときの着地点。"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema: { type: string }
      x-data-testids: ["screen-top"]

  /about:
    get:
      operationId: "screen_about"
      tags: ["screens-top"]
      summary: "このシステムについて"
      description: "この企画で何ができ、何を意図して作らなかったかを説明する画面。DBに繋がらなくても開けること。"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema: { type: string }
      x-data-testids: ["screen-about"]

  # ============================================================
  # 画面のルート — 2 受付・患者
  # ============================================================

  /today:
    get:
      operationId: "screen_today"
      tags: ["screens-reception"]
      summary: "本日の患者（一覧）"
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string }
          description: "受付区分タブ。省略時はマスタの1つ目。マスタに無い区分が来たら空一覧を出さずに1つ目へ戻す。"
        - name: hide
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: "'1' のとき、完了（status=done）を一覧から隠す。既定は表示。"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema: { type: string }
      x-data-testids: ["screen-today", "row-reception", "empty-reception"]

  /animals/new:
    get:
      operationId: "screen_new_animal_form"
      tags: ["screens-reception"]
      summary: "新規登録（画面）"
      parameters:
        - name: owner
          in: query
          required: false
          schema: { type: string }
          description: "既存飼主の owner_no。付けるとその飼主に動物を1頭足す形になる。付けなければ飼主と1頭目をまとめて作る。"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema: { type: string }
      x-data-testids: ["screen-new-animal"]
    post:
      operationId: "screen_create_animal"
      tags: ["screens-reception"]
      summary: "新規登録（保存）"
      parameters:
        - name: owner
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/PatientWithOwnerForm" }
      responses:
        "200":
          description: "保存の成否によらず200。失敗時はフォームを再描画し error-banner に文言を出す。"
          content:
            text/html:
              schema: { type: string }
      x-data-testids: ["screen-new-animal", "success-banner", "error-banner"]

  /animals/{karte_no}:
    get:
      operationId: "screen_animal_detail"
      tags: ["screens-reception"]
      summary: "顧客（飼主・動物の詳細）"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-animal-detail"]

  /animals/{karte_no}/delete:
    get:
      operationId: "screen_delete_animal_confirm"
      tags: ["screens-reception"]
      summary: "削除（確認画面）"
      description: "飼主・動物の論理削除の確認画面。物理削除は行わない（`model.md` 「消さずに印を付ける」）。"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-delete-confirm"]
    post:
      operationId: "screen_delete_animal"
      tags: ["screens-reception"]
      summary: "削除（実行）"
      description: |
        Patient.deleted_at に日時を入れる（論理削除）。この動物がその飼主の最後の1頭なら
        Owner.deleted_at にも日時を入れる。**物理削除はしない。**
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200":
          description: "削除できた場合も、権限が無く断った場合も200で結果を文で返す。"
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-delete-confirm", "success-banner", "error-banner"]

  /search:
    get:
      operationId: "screen_search"
      tags: ["screens-reception"]
      summary: "検索"
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: "飼主名・カナ・カルテNo・電話番号・診療の中身を横断する1つの検索語。"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
      x-data-testids: ["screen-search", "row-patient", "row-visit", "empty-search"]

  /animals/{karte_no}/history:
    get:
      operationId: "screen_animal_history"
      tags: ["screens-reception"]
      summary: "来院履歴"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-history", "row-visit", "empty-history"]

  /folded/{key}:
    get:
      operationId: "screen_folded"
      tags: ["screens-reception"]
      summary: "折りたたみ表示（この企画で意図して作らなかった機能の説明）"
      description: |
        `model.md` の「落としたもの」に対応する画面。`key` は固定の語彙で、
        実際に使う値の一覧は `spec/screens.md` / `spec/model.md` を正とする
        （契約が凍結される前にこの2文書が変わりうるため、ここでは enum に
        固定しない）。未知の `key` は404。
      parameters:
        - $ref: "#/components/parameters/FoldedKey"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-folded"]

  # ============================================================
  # 画面のルート — 3 診療
  # ============================================================

  /animals/{karte_no}/karte:
    get:
      operationId: "screen_karte"
      tags: ["screens-clinical"]
      summary: "カルテ"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-karte", "row-visit"]
    post:
      operationId: "screen_save_karte"
      tags: ["screens-clinical"]
      summary: "カルテ保存（診察本体＋経過記録）"
      description: |
        1回の保存で Visit 本体と、複数行の ProgressNote をまとめて保存する。
        **体温などの数値は行ごとに独立して保存すること。**
        実システムで「全患者に同じ体温が印字される」不具合が実際に出ている
        （`model.md` 7章）。保存を断ったときは、打った値をそのままフォームへ返す
        （確定済みの値で上書きしない）。
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/VisitForm" }
      responses:
        "200":
          description: "保存の成否によらず200。失敗時はフォームを再描画し error-banner に文言を出す。"
          content:
            text/html:
              schema: { type: string }
      x-data-testids: ["screen-karte", "success-banner", "error-banner"]

  /animals/{karte_no}/karte/new:
    get:
      operationId: "screen_karte_new"
      tags: ["screens-clinical"]
      summary: "カルテ（新規診察の入力フォーム）"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-karte"]

  /animals/{karte_no}/karte/copy_prev:
    get:
      operationId: "screen_karte_copy_prev"
      tags: ["screens-clinical"]
      summary: "前回コピー"
      description: |
        直前の診察の内容を新規診察フォームへ写して開く。**直前の診察が無いときだけ
        灰色でよい**（欠落ではなく正しい状態。`docs` の実装分担にある区別と同じ）。
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-karte"]

  /animals/{karte_no}/karte/cancel:
    post:
      operationId: "screen_karte_cancel"
      tags: ["screens-clinical"]
      summary: "取消（書きかけの入力を捨てる）"
      description: "**捨てる書きかけが無いときだけ灰色でよい**（前回コピーと同じ理由）。"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
      x-data-testids: ["screen-karte", "success-banner"]

  /animals/{karte_no}/karte/print:
    get:
      operationId: "screen_karte_print"
      tags: ["screens-clinical"]
      summary: "カルテ印刷（この動物の全診察分）"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-karte-print"]

  /animals/{karte_no}/karte/{visit_id}/print:
    get:
      operationId: "screen_visit_print"
      tags: ["screens-clinical"]
      summary: "カルテ印刷（1診察分）"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-karte-print"]

  /animals/{karte_no}/karte/{visit_id}/delete:
    post:
      operationId: "screen_visit_delete"
      tags: ["screens-clinical"]
      summary: "診察の削除（論理削除）"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-karte", "success-banner", "error-banner"]

  /animals/{karte_no}/karte/{visit_id}/restore:
    post:
      operationId: "screen_visit_restore"
      tags: ["screens-clinical"]
      summary: "診察の削除の取り消し（復元）"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-karte", "success-banner"]

  /animals/{karte_no}/exam:
    get:
      operationId: "screen_exam"
      tags: ["screens-clinical"]
      summary: "検査"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-data-testids: ["screen-exam", "lab-item-value", "lab-item-judgment"]
    post:
      operationId: "screen_save_exam"
      tags: ["screens-clinical"]
      summary: "検査保存"
      description: |
        基準値は `data/lab_items.json`（固定データ）から引く。**保存はしない。**
        基準の外にある値は、判定欄と色の両方で分かるようにすること
        （判定欄＝`lab-item-<item_code>-judgment`、色は `out_of_range` を見て
        各スタックが決めてよい）。
      parameters:
        - $ref: "#/components/parameters/KarteNo"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/LabTestForm" }
      responses:
        "200":
          description: "保存の成否によらず200。"
          content:
            text/html:
              schema: { type: string }
      x-data-testids: ["screen-exam", "success-banner", "error-banner"]

  /animals/{karte_no}/dosing/{kind_id}:
    get:
      operationId: "screen_dosing"
      tags: ["screens-clinical"]
      summary: "投薬（月ごとの記録）"
      parameters:
        - $ref: "#/components/parameters/KarteNo"
        - $ref: "#/components/parameters/DosingKindId"
        - name: fiscal_year
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/HtmlOk" }
