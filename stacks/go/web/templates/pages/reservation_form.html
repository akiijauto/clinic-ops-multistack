{{define "title"}}予約フォーム{{end}}
{{define "content"}}
<div data-testid="screen-reservations">
  <h1>{{if .Reservation}}予約の変更{{else}}新規予約{{end}}</h1>
  {{if .SuccessMessage}}<p data-testid="success-banner">{{.SuccessMessage}}</p>{{end}}
  {{if .ErrorMessage}}<p data-testid="error-banner">{{.ErrorMessage}}</p>{{end}}

  {{if .Reservation}}
  <form method="post" action="/reservations/{{.Reservation.ID}}">
    <label>動物ID <input name="patient_id"></label>
    <label>開始 <input type="datetime-local" name="starts_at" value="{{.Reservation.Starts}}"></label>
    <label>終了 <input type="datetime-local" name="ends_at" value="{{.Reservation.Ends}}"></label>
    <label>担当ID <input name="staff_id" value="{{.Reservation.StaffID}}"></label>
    <label>処置室 <input name="room" value="{{.Reservation.Room}}"></label>
    <label>目的 <input name="purpose"></label>
    <button type="submit">変更する</button>
  </form>
  {{else}}
  <form method="post" action="/reservations">
    <label>動物ID <input name="patient_id" value="{{.KarteNo}}"></label>
    <label>開始 <input type="datetime-local" name="starts_at"></label>
    <label>終了 <input type="datetime-local" name="ends_at"></label>
    <label>担当ID <input name="staff_id"></label>
    <label>処置室 <input name="room"></label>
    <label>目的 <input name="purpose"></label>
    <button type="submit">登録する</button>
  </form>
  {{end}}

  <p><a href="/reservations">予約一覧へ戻る</a> ／ <a href="/">トップへ戻る</a></p>
</div>
{{end}}
