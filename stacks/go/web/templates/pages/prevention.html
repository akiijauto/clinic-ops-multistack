{{define "title"}}予防 {{.KarteNo}}{{end}}
{{define "content"}}
<div data-testid="screen-prevention">
  <h1>予防（{{.KindName}}）</h1>
  {{if .ErrorMessage}}<p data-testid="error-banner">{{.ErrorMessage}}</p>{{end}}

  {{if not .Rows}}
  <p data-testid="empty-prevention">まだ記録がありません。</p>
  {{else}}
  <table>
    <thead><tr><th>実施日</th><th>次回予定日</th><th>内容</th></tr></thead>
    <tbody>
      {{range .Rows}}
      <tr data-testid="row-prevention" data-prevention-id="{{.ID}}">
        <td>{{.PerformedDate}}</td>
        <td>{{.NextDueDate}}</td>
        <td>{{.Content}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
  {{end}}

  <form method="post" action="/animals/{{.KarteNo}}/prevention/{{.KindID}}">
    <label>実施日 <input type="date" name="performed_date"></label>
    <label>次回予定日（空なら自動計算。周期未設定の種別は空のまま） <input type="date" name="next_due_date"></label>
    <label>内容 <input name="content"></label>
    <label>担当医ID（未選択可） <input name="staff_id"></label>
    <button type="submit">保存</button>
  </form>

  <p><a href="/animals/{{.KarteNo}}/karte">カルテへ戻る</a> ／ <a href="/">トップへ戻る</a></p>
</div>
{{end}}
